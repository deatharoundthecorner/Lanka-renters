<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="100%" stop-color="#FFEDD5" />
    </linearGradient>
    <linearGradient id="suvGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" />
  <g transform="translate(100, 80)">
    <line x1="0" y1="300" x2="600" y2="300" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" />
    <ellipse cx="300" cy="295" rx="250" ry="15" fill="#1E293B" opacity="0.15" />
    
    <!-- SUV Body -->
    <path d="M 80 140 L 220 140 L 320 120 L 460 120 C 490 120 510 135 530 165 L 550 200 L 550 275 L 80 275 Z" fill="url(#suvGrad)" />
    
    <!-- Windows -->
    <path d="M 230 145 L 315 145 L 315 195 L 230 195 Z" fill="#FFFFFF" opacity="0.75" />
    <path d="M 330 135 L 435 135 L 435 195 L 330 195 Z" fill="#FFFFFF" opacity="0.75" />
    <path d="M 450 135 L 490 135 C 505 135 515 145 520 160 C 525 170 525 185 525 195 L 450 195 Z" fill="#FFFFFF" opacity="0.75" />
    
    <!-- Wheel Arches -->
    <path d="M 110 275 A 50 50 0 0 1 210 275" fill="none" stroke="#FFEDD5" stroke-width="8" />
    <path d="M 390 275 A 50 50 0 0 1 490 275" fill="none" stroke="#FFEDD5" stroke-width="8" />
    
    <!-- Wheels -->
    <circle cx="160" cy="275" r="42" fill="#1E293B" stroke="#64748B" stroke-width="6" />
    <circle cx="160" cy="275" r="18" fill="#94A3B8" />
    <circle cx="440" cy="275" r="42" fill="#1E293B" stroke="#64748B" stroke-width="6" />
    <circle cx="440" cy="275" r="18" fill="#94A3B8" />
  </g>
  <text x="50%" y="450" font-family="'Outfit', sans-serif" font-size="28" font-weight="700" fill="#1E293B" text-anchor="middle">Lanka Renters - Premium SUV</text>
</svg>
